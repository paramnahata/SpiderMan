<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b51226">
<meta name="description" content="Play Spider-Man with keyboard or touch, online or offline.">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Spider-Man Game</title>
<link rel="icon" href="images/spider-head.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/mobile.css?v=4">
</head>
<body>
<main class="canvas-wrapper">
<header><strong>SPIDER-MAN</strong><div><button id="install" hidden>Install</button><button id="pause" disabled>Pause</button></div></header>
<div class="stage"><canvas id="canvas" aria-label="Spider-Man rooftop game"></canvas></div>
<p class="keyboard">Arrow keys: move and jump / Space: shoot / Esc: pause</p>
<div class="touch-controls" aria-label="Game controls">
<div class="shoot-group"><button data-key="32" class="shoot" aria-label="Hold to shoot webs">Shoot</button></div>
<div class="joystick-group"><div id="joystick" role="group" aria-label="Press and slide to run or jump"><span class="pad-cross" aria-hidden="true"></span><span class="pad-up" aria-hidden="true">&#9650;</span><span class="pad-left" aria-hidden="true">&#9664;</span><span class="pad-right" aria-hidden="true">&#9654;</span><span class="pad-down" aria-hidden="true">&#9660;</span><span id="joystick-knob" aria-hidden="true"></span></div><span class="control-hint">Slide to run / Up to jump</span></div>
</div>
<p id="status" role="status">Loading game...</p>
<footer>Param's creation / iPhone: Share &gt; Add to Home Screen</footer>
</main>
<script src="spiderman-game.js?v=4"></script>
<script src="app.js?v=4"></script>
</body></html>
